[tool.poetry]
name = "loading"
version = "0.1.0"
description = "Matrix data analysis: loading programs with Poetry"
authors = ["Henrique Danielewicz"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"
requests = ">=2.31"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
