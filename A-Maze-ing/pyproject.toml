# Receita para transformar a pasta mazegen/ num pacote pip.
# Para gerar o arquivo .whl:  make package
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Seeded maze generator (perfect or Pac-Man mode) with a '42' pattern"
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["README.md", "py.typed"]

[tool.mypy]
exclude = ["build/", "dist/", ".venv/"]
